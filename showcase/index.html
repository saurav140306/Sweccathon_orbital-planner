<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbital Planner — Mesocosm Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
  <style>
    :root {
      --bg: #0f1a14;
      --panel: #16241c;
      --mint: #5dcaa5;
      --gold: #e8c170;
      --text: #f5f0e6;
      --muted: rgba(245,240,230,.55);
      --line: rgba(143,184,155,.2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Source Sans 3", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: .75rem;
    }
    h1 { font-family: Cormorant, serif; font-size: 2rem; margin: 0; }
    .sub { color: var(--muted); font-size: .85rem; margin: .2rem 0 0; }
    main {
      display: grid;
      grid-template-columns: 260px 1fr 300px;
      gap: 1rem;
      padding: 1rem 1.5rem 1.5rem;
      min-height: calc(100vh - 5rem);
    }
    @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: .85rem;
    }
    .label {
      font-size: .62rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--mint);
      margin: 0 0 .5rem;
    }
    .tier-label {
      font-size: .58rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: .65rem 0 .25rem;
    }
    .ep-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      padding: .45rem .55rem;
      margin-bottom: .3rem;
      cursor: pointer;
      border-radius: 2px;
      font-size: .76rem;
      line-height: 1.35;
    }
    .ep-btn.active { border-color: var(--mint); background: rgba(93,202,165,.08); }
    .ep-btn.missing { opacity: 0.45; cursor: not-allowed; }
    .ep-btn .ep-score { color: var(--muted); font-size: .7rem; }
    .viewport-panel { display: flex; flex-direction: column; min-height: 520px; }
    .dual-viewport {
      display: flex;
      flex: 1;
      gap: .65rem;
      min-height: 440px;
      min-width: 0;
    }
    .main3d, .birdeye-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .main3d { flex: 1.55; }
    .birdeye-panel { flex: 1; max-width: 360px; min-width: 220px; }
    .view-label {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin: 0 0 .35rem;
    }
    .viewport-shell {
      position: relative;
      flex: 1;
      min-height: 380px;
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
      background: #16241c;
    }
    #viewportMount { position: absolute; inset: 0; }
    #birdEyeCanvas {
      width: 100%;
      height: 100%;
      min-height: 380px;
      display: block;
    }
    .legend {
      position: absolute;
      left: 10px;
      bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: .5rem .85rem;
      padding: .45rem .65rem;
      background: rgba(22, 36, 28, .82);
      border: 1px solid var(--line);
      border-radius: 3px;
      font-size: .72rem;
      color: rgba(245,240,230,.75);
      pointer-events: none;
      z-index: 2;
    }
    .miss-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: .45rem .65rem;
      background: rgba(22, 36, 28, .9);
      border: 1px solid rgba(232, 193, 112, .45);
      border-radius: 3px;
      font-size: .72rem;
      text-align: right;
      pointer-events: none;
      z-index: 2;
    }
    .miss-badge strong { color: var(--gold); display: block; font-size: .85rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      align-items: center;
      margin-top: .65rem;
    }
    button.ctrl {
      background: rgba(93,202,165,.12);
      border: 1px solid var(--mint);
      color: var(--text);
      padding: .35rem .65rem;
      cursor: pointer;
      border-radius: 2px;
      font-size: .78rem;
    }
    input[type=range] { flex: 1; min-width: 120px; accent-color: var(--mint); }
    .time-label { font-size: .75rem; color: var(--muted); min-width: 10rem; text-align: right; }
    .hud { font-size: .82rem; line-height: 1.5; }
    .hud strong { color: var(--mint); }
    pre {
      background: rgba(0,0,0,.25);
      padding: .55rem;
      border-radius: 2px;
      font-size: .72rem;
      overflow: auto;
      max-height: 140px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .reasoning { color: var(--gold); font-style: italic; font-size: .82rem; line-height: 1.45; }
    .score-big {
      font-family: Cormorant, serif;
      font-size: 2.4rem;
      color: var(--mint);
      margin: .25rem 0;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Orbital Planner</h1>
      <p class="sub">14 scenarios · GPT-4o replay · 3D + bird&apos;s eye (10s animation cap at 1×)</p>
    </div>
    <div class="hud" id="runHud">Loading replay…</div>
  </header>
  <main>
    <aside class="panel">
      <p class="label">Scenarios (14)</p>
      <div id="episodeRail"></div>
    </aside>
    <section class="panel viewport-panel">
      <div class="dual-viewport">
        <div class="main3d">
          <p class="view-label">3D — auto-tracked</p>
          <div class="viewport-shell">
            <div id="viewportMount" aria-label="3D orbital viewport"></div>
            <div class="legend">
              <span>◆ Chaser</span>
              <span>◇ Target</span>
              <span>⊕ Earth spin</span>
            </div>
            <div class="miss-badge" id="missBadge" hidden>
              <strong id="missVal">—</strong>
              <span id="caVal">—</span>
            </div>
          </div>
        </div>
        <div class="birdeye-panel">
          <p class="view-label">Bird&apos;s eye (equatorial)</p>
          <div class="viewport-shell">
            <canvas id="birdEyeCanvas" aria-label="Bird's eye orbital view"></canvas>
          </div>
        </div>
      </div>
      <div class="controls">
        <button class="ctrl" id="btnPlay">Play</button>
        <button class="ctrl" id="btnPrev">◀</button>
        <button class="ctrl" id="btnNext">▶</button>
        <input type="range" id="scrub" min="0" max="7200" step="10" value="0" />
        <select id="speed" class="ctrl" title="1× = full mission in 10s wall time">
          <option value="0.5">0.5× (20s)</option>
          <option value="1" selected>1× (10s cap)</option>
          <option value="2">2× (5s)</option>
          <option value="4">4× (2.5s)</option>
        </select>
        <span class="time-label" id="timeLabel">T+0 s / 7200 s</span>
      </div>
    </section>
    <aside class="panel">
      <p class="label">Turn HUD</p>
      <div class="score-big" id="scoreVal">—</div>
      <div class="hud" id="metrics"></div>
      <p class="label" style="margin-top:.75rem">Reasoning</p>
      <p class="reasoning" id="reasoning">—</p>
      <p class="label" style="margin-top:.75rem">Action</p>
      <pre id="action"></pre>
    </aside>
  </main>
  <script type="application/json" id="scenarios-json">{"tiers":{"easy":[{"id":"raise-easy-01","name":"Gentle orbit raise","tier":"easy"},{"id":"station-easy-02","name":"Station-keeping hop","tier":"easy"}],"medium":[{"id":"intercept-01","name":"Intercept derelict satellite","tier":"medium"},{"id":"phase-medium-02","name":"Phasing rendezvous","tier":"medium"},{"id":"transfer-medium-03","name":"Elliptic transfer slot","tier":"medium"}],"hard":[{"id":"rescue-hard-01","name":"Rescue capsule intercept","tier":"hard"},{"id":"debris-hard-02","name":"Debris avoidance slot","tier":"hard"},{"id":"sync-hard-03","name":"GEO slot sync (scaled)","tier":"hard"},{"id":"tight-hard-04","name":"Tight tolerance flyby","tier":"hard"},{"id":"leo-classic-01","name":"Classic LEO [7000,0] → [0,10000]","tier":"hard"}],"expert":[{"id":"compound-expert-01","name":"Compound plane change","tier":"expert"},{"id":"minfuel-expert-02","name":"Minimum-fuel intercept","tier":"expert"},{"id":"longarc-expert-03","name":"Long-arc reposition","tier":"expert"},{"id":"edge-expert-04","name":"Edge-of-budget sprint","tier":"expert"}]},"all":[{"id":"raise-easy-01","name":"Gentle orbit raise","tier":"easy"},{"id":"station-easy-02","name":"Station-keeping hop","tier":"easy"},{"id":"intercept-01","name":"Intercept derelict satellite","tier":"medium"},{"id":"phase-medium-02","name":"Phasing rendezvous","tier":"medium"},{"id":"transfer-medium-03","name":"Elliptic transfer slot","tier":"medium"},{"id":"rescue-hard-01","name":"Rescue capsule intercept","tier":"hard"},{"id":"debris-hard-02","name":"Debris avoidance slot","tier":"hard"},{"id":"sync-hard-03","name":"GEO slot sync (scaled)","tier":"hard"},{"id":"tight-hard-04","name":"Tight tolerance flyby","tier":"hard"},{"id":"compound-expert-01","name":"Compound plane change","tier":"expert"},{"id":"minfuel-expert-02","name":"Minimum-fuel intercept","tier":"expert"},{"id":"longarc-expert-03","name":"Long-arc reposition","tier":"expert"},{"id":"edge-expert-04","name":"Edge-of-budget sprint","tier":"expert"},{"id":"leo-classic-01","name":"Classic LEO [7000,0] → [0,10000]","tier":"hard"}]}</script>
  <script src="js/demo-boot.js"></script>
</body>
</html>
