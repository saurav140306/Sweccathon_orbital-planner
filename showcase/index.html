<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbital Planner — Mesocosm Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1a14;
      --panel: #16241c;
      --mint: #5dcaa5;
      --gold: #e8c170;
      --text: #f5f0e6;
      --muted: rgba(245,240,230,.55);
      --line: rgba(143,184,155,.2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Source Sans 3", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: .75rem;
    }
    h1 {
      font-family: Cormorant, serif;
      font-size: 2rem;
      margin: 0;
    }
    .sub { color: var(--muted); font-size: .85rem; margin: .2rem 0 0; }
    main {
      display: grid;
      grid-template-columns: 220px 1fr 300px;
      gap: 1rem;
      padding: 1rem 1.5rem 1.5rem;
      min-height: calc(100vh - 5rem);
    }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: .85rem;
    }
    .label {
      font-size: .62rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--mint);
      margin: 0 0 .5rem;
    }
    .ep-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      padding: .45rem .55rem;
      margin-bottom: .35rem;
      cursor: pointer;
      border-radius: 2px;
      font-size: .78rem;
    }
    .ep-btn.active { border-color: var(--mint); background: rgba(93,202,165,.08); }
    canvas {
      width: 100%;
      height: 420px;
      display: block;
      background: #0c1510;
      border-radius: 2px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      align-items: center;
      margin-top: .65rem;
    }
    button.ctrl {
      background: rgba(93,202,165,.12);
      border: 1px solid var(--mint);
      color: var(--text);
      padding: .35rem .65rem;
      cursor: pointer;
      border-radius: 2px;
      font-size: .78rem;
    }
    input[type=range] { flex: 1; min-width: 120px; accent-color: var(--mint); }
    .hud { font-size: .82rem; line-height: 1.5; }
    .hud strong { color: var(--mint); }
    pre {
      background: rgba(0,0,0,.25);
      padding: .55rem;
      border-radius: 2px;
      font-size: .72rem;
      overflow: auto;
      max-height: 140px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .reasoning { color: var(--gold); font-style: italic; }
    .score-big {
      font-family: Cormorant, serif;
      font-size: 2.4rem;
      color: var(--mint);
      margin: .25rem 0;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Orbital Planner</h1>
      <p class="sub">Mesocosm replay — drive the agent's mission plans turn by turn</p>
    </div>
    <div class="hud" id="runHud">Loading replay…</div>
  </header>
  <main>
    <aside class="panel">
      <p class="label">Episodes</p>
      <div id="episodeRail"></div>
    </aside>
    <section class="panel">
      <p class="label">Orbital viewport</p>
      <canvas id="canvas" width="800" height="420"></canvas>
      <div class="controls">
        <button class="ctrl" id="btnPlay">Play</button>
        <button class="ctrl" id="btnPrev">◀</button>
        <button class="ctrl" id="btnNext">▶</button>
        <input type="range" id="scrub" min="0" max="0" value="0" />
        <select id="speed" class="ctrl">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
        <span id="turnLabel" class="hud">T 0/0 · 0s</span>
      </div>
    </section>
    <aside class="panel">
      <p class="label">Turn HUD</p>
      <div class="score-big" id="scoreVal">—</div>
      <div class="hud" id="metrics"></div>
      <p class="label" style="margin-top:.75rem">Reasoning</p>
      <p class="reasoning" id="reasoning">—</p>
      <p class="label" style="margin-top:.75rem">Action</p>
      <pre id="action"></pre>
    </aside>
  </main>
  <script src="data/replay.js"></script>
  <script>
    const EARTH_R = 6371;
    const MU = 398600;
    let DATA = window.REPLAY;
    let epId = null;
    let turnIdx = 0;
    let frameIdx = 0;
    let playing = false;
    let animId = null;
    let animLastTs = 0;

    async function loadReplay() {
      if (DATA) return DATA;
      try {
        const res = await fetch("data/replay.json");
        DATA = await res.json();
      } catch {
        DATA = { run: {}, episodes: [], replay: {} };
      }
      return DATA;
    }

    function parseInfo(info) {
      const out = {};
      for (const [k, v] of Object.entries(info || {})) {
        try { out[k] = JSON.parse(v); } catch { out[k] = v; }
      }
      return out;
    }

    function parseTraj(val) {
      if (!val) return [];
      if (Array.isArray(val)) return val;
      if (typeof val === "string") {
        try { return JSON.parse(val); } catch { return []; }
      }
      return [];
    }

    function turns() { return (DATA.replay && DATA.replay[epId]) || []; }

    function currentTurn() {
      const tlist = turns();
      return tlist[turnIdx] || null;
    }

    function trajForTurn(t) {
      const info = parseInfo(t?.info);
      return {
        chaser: parseTraj(info.chaser_traj_json),
        target: parseTraj(info.target_traj_json),
        info,
      };
    }

    function maxFrames() {
      const { chaser } = trajForTurn(currentTurn());
      return Math.max(1, chaser.length);
    }

    function sampleAtTime(pts, t) {
      if (!pts.length) return null;
      if (t <= pts[0].t_s) return { ...pts[0] };
      for (let i = 1; i < pts.length; i++) {
        if (pts[i].t_s >= t) {
          const a = pts[i - 1], b = pts[i];
          const u = (t - a.t_s) / (b.t_s - a.t_s || 1);
          return { t_s: t, x: a.x + u * (b.x - a.x), y: a.y + u * (b.y - a.y) };
        }
      }
      return { ...pts[pts.length - 1] };
    }

    function stopPlay() {
      playing = false;
      if (animId) cancelAnimationFrame(animId);
      animId = null;
      document.getElementById("btnPlay").textContent = "Play";
    }

    function syncScrubRange() {
      const scrub = document.getElementById("scrub");
      const frames = maxFrames();
      const tlist = turns();
      if (tlist.length > 1) {
        scrub.max = Math.max(0, tlist.length - 1);
        scrub.value = turnIdx;
      } else {
        scrub.max = Math.max(0, frames - 1);
        scrub.value = frameIdx;
      }
    }

    function setEpisode(id) {
      epId = id;
      turnIdx = 0;
      frameIdx = 0;
      stopPlay();
      document.querySelectorAll(".ep-btn").forEach(b => b.classList.toggle("active", b.dataset.id === id));
      syncScrubRange();
      renderTurn();
    }

    function renderTurn(resetFrame) {
      const t = currentTurn();
      if (!t) return;
      if (resetFrame) frameIdx = 0;
      frameIdx = Math.max(0, Math.min(maxFrames() - 1, frameIdx));

      const { chaser, target, info } = trajForTurn(t);
      const tlist = turns();
      const missionT = chaser[frameIdx]?.t_s ?? 0;
      const tgtNow = sampleAtTime(target, missionT);

      document.getElementById("turnLabel").textContent =
        tlist.length > 1
          ? `Turn ${turnIdx + 1}/${tlist.length} · t=${missionT.toFixed(0)}s`
          : `Mission t=${missionT.toFixed(0)}s · ${frameIdx + 1}/${maxFrames()}`;
      syncScrubRange();
      document.getElementById("scoreVal").textContent = info.score ?? "—";
      document.getElementById("metrics").innerHTML = `
        <div><strong>Reward</strong> ${Number(t.reward).toFixed(3)}</div>
        <div><strong>Miss</strong> ${info.miss_km ?? "—"} km</div>
        <div><strong>Fuel</strong> ${info.fuel_used ?? "—"} km/s</div>
        <div><strong>Mission time</strong> ${missionT.toFixed(0)} s</div>
        <div><strong>Scenario</strong> ${info.scenario_name ?? info.scenario_id ?? "—"}</div>
      `;
      document.getElementById("reasoning").textContent =
        t.reasoning || info.agent_reasoning || "—";
      document.getElementById("action").textContent = typeof t.action === "string" ? t.action : JSON.stringify(t.action, null, 2);
      drawOrbit(chaser, target, tgtNow, t.observation, frameIdx, missionT);
    }

    function idxUpToTime(pts, t) {
      let idx = 0;
      for (let i = 0; i < pts.length; i++) {
        if (pts[i].t_s <= t) idx = i;
      }
      return idx;
    }

    function drawOrbit(chaser, target, tgtNow, obs, frame, missionT) {
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = "#0c1510";
      ctx.fillRect(0, 0, w, h);

      const all = [...chaser, ...target];
      if (!all.length) return;

      const maxR = Math.max(12000, ...all.map(p => Math.hypot(p.x, p.y)), EARTH_R * 2);
      const cx = w / 2, cy = h / 2, scale = (Math.min(w, h) * 0.42) / maxR;
      const toS = (x, y) => [cx + x * scale, cy - y * scale];

      ctx.strokeStyle = "rgba(143,184,155,.12)";
      for (const r of [8000, 10000, 12000]) {
        ctx.beginPath(); ctx.arc(cx, cy, r * scale, 0, Math.PI * 2); ctx.stroke();
      }
      const eg = ctx.createRadialGradient(cx, cy, 10, cx, cy, EARTH_R * scale);
      eg.addColorStop(0, "#2a4538"); eg.addColorStop(1, "#8FB89B");
      ctx.fillStyle = eg;
      ctx.beginPath(); ctx.arc(cx, cy, EARTH_R * scale, 0, Math.PI * 2); ctx.fill();

      function drawPath(pts, endIdx, color, alpha, width) {
        if (!pts.length) return;
        const n = Math.min(endIdx + 1, pts.length);
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.beginPath();
        const [x0, y0] = toS(pts[0].x, pts[0].y);
        ctx.moveTo(x0, y0);
        for (let i = 1; i < n; i++) {
          const [x, y] = toS(pts[i].x, pts[i].y);
          ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      function drawMarker(pt, color, radius, ring) {
        if (!pt) return;
        const [sx, sy] = toS(pt.x, pt.y);
        if (ring) {
          ctx.strokeStyle = ring;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(sx, sy, radius + 5, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(sx, sy, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f5f0e6";
        ctx.beginPath();
        ctx.arc(sx, sy, radius * 0.35, 0, Math.PI * 2);
        ctx.fill();
      }

      const tgtEnd = idxUpToTime(target, missionT);

      drawPath(target, target.length - 1, "rgba(200,200,190,.35)", 0.35, 1);
      drawPath(chaser, chaser.length - 1, "#5dcaa5", 0.25, 1);
      drawPath(target, tgtEnd, "rgba(200,200,190,.85)", 1, 2);
      drawPath(chaser, frame, "#5dcaa5", 1, 2.5);

      const chNow = chaser[frame];
      drawMarker(tgtNow || target[tgtEnd], "rgba(200,200,190,.95)", 7, "rgba(232,193,112,.6)");
      drawMarker(chNow, "#5dcaa5", 8, "#e8c170");

      if (frame === 0 && chaser.length > 1) {
        const [bx, by] = toS(chaser[0].x, chaser[0].y);
        ctx.strokeStyle = "rgba(232,193,112,.9)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + 28, by - 18);
        ctx.stroke();
        ctx.fillStyle = "#e8c170";
        ctx.font = "11px Source Sans 3, sans-serif";
        ctx.fillText("Δv burn", bx + 32, by - 14);
      }

      if (obs?.target?.tolerance_km && tgtNow) {
        const [sx, sy] = toS(tgtNow.x, tgtNow.y);
        ctx.strokeStyle = "rgba(232,193,112,.35)";
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(sx, sy, obs.target.tolerance_km * scale, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      const sep = chNow && tgtNow ? Math.hypot(chNow.x - tgtNow.x, chNow.y - tgtNow.y) : null;
      if (sep != null) {
        ctx.fillStyle = "rgba(245,240,230,.7)";
        ctx.font = "12px Source Sans 3, sans-serif";
        ctx.fillText(`Separation ${sep.toFixed(0)} km`, 12, 22);
      }
    }

    function stepFrame(delta) {
      const max = maxFrames() - 1;
      frameIdx = Math.max(0, Math.min(max, frameIdx + delta));
      renderTurn(false);
    }

    function stepTurn(delta) {
      const max = turns().length - 1;
      turnIdx = Math.max(0, Math.min(max, turnIdx + delta));
      frameIdx = 0;
      renderTurn(false);
    }

    function step(delta) {
      if (turns().length > 1) stepTurn(delta);
      else stepFrame(delta);
    }

    function animLoop(ts) {
      if (!playing) return;
      const spd = Number(document.getElementById("speed").value);
      const interval = 45 / spd;
      if (!animLastTs) animLastTs = ts;
      if (ts - animLastTs >= interval) {
        animLastTs = ts;
        if (frameIdx < maxFrames() - 1) {
          frameIdx++;
          renderTurn(false);
        } else {
          stopPlay();
          return;
        }
      }
      animId = requestAnimationFrame(animLoop);
    }

    function startPlay() {
      if (frameIdx >= maxFrames() - 1) frameIdx = 0;
      playing = true;
      animLastTs = 0;
      document.getElementById("btnPlay").textContent = "Pause";
      animId = requestAnimationFrame(animLoop);
    }

    async function init() {
      await loadReplay();
      const eps = DATA.episodes || [];
      const rail = document.getElementById("episodeRail");
      rail.innerHTML = "";
      const ids = eps.length ? eps.map(e => e.id) : Object.keys(DATA.replay || {});
      ids.forEach((id, i) => {
        const btn = document.createElement("button");
        btn.className = "ep-btn" + (i === 0 ? " active" : "");
        btn.dataset.id = id;
        const sc = eps.find(e => e.id === id)?.score;
        btn.textContent = sc != null ? `${id.slice(0, 12)}… (${sc})` : id;
        btn.onclick = () => setEpisode(id);
        rail.appendChild(btn);
      });
      if (ids.length) setEpisode(ids[0]);
      const ms = DATA.run?.scores?.mission_score;
      document.getElementById("runHud").textContent = ms != null ? `Run mission_score: ${ms}` : "Demo replay loaded";
    }

    document.getElementById("btnPlay").onclick = () => {
      if (playing) stopPlay();
      else startPlay();
    };
    document.getElementById("btnPrev").onclick = () => { stopPlay(); step(-1); };
    document.getElementById("btnNext").onclick = () => { stopPlay(); step(1); };
    document.getElementById("scrub").oninput = (e) => {
      stopPlay();
      const v = Number(e.target.value);
      if (turns().length > 1) {
        turnIdx = v;
        frameIdx = 0;
      } else {
        frameIdx = v;
      }
      renderTurn(false);
    };
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") { e.preventDefault(); document.getElementById("btnPlay").click(); }
      if (e.code === "ArrowLeft") { stopPlay(); step(-1); }
      if (e.code === "ArrowRight") { stopPlay(); step(1); }
    });
    init();
  </script>
</body>
</html>
