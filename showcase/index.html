<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbital Planner — Mesocosm Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1a14;
      --panel: #16241c;
      --mint: #5dcaa5;
      --gold: #e8c170;
      --text: #f5f0e6;
      --muted: rgba(245,240,230,.55);
      --line: rgba(143,184,155,.2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Source Sans 3", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: .75rem;
    }
    h1 {
      font-family: Cormorant, serif;
      font-size: 2rem;
      margin: 0;
    }
    .sub { color: var(--muted); font-size: .85rem; margin: .2rem 0 0; }
    main {
      display: grid;
      grid-template-columns: 240px 1fr 300px;
      gap: 1rem;
      padding: 1rem 1.5rem 1.5rem;
      min-height: calc(100vh - 5rem);
    }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: .85rem;
    }
    .label {
      font-size: .62rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--mint);
      margin: 0 0 .5rem;
    }
    .ep-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      padding: .5rem .55rem;
      margin-bottom: .35rem;
      cursor: pointer;
      border-radius: 2px;
      font-size: .78rem;
      line-height: 1.35;
    }
    .ep-btn.active { border-color: var(--mint); background: rgba(93,202,165,.08); }
    .ep-btn .ep-score { color: var(--muted); font-size: .72rem; }
    .viewport-panel { display: flex; flex-direction: column; min-height: 480px; }
    .view-label {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin: 0 0 .35rem;
    }
    .viewport-shell {
      position: relative;
      flex: 1;
      min-height: 420px;
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
      background: #16241c;
    }
    #viewportMount { position: absolute; inset: 0; }
    .legend {
      position: absolute;
      left: 10px;
      bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: .5rem .85rem;
      padding: .45rem .65rem;
      background: rgba(22, 36, 28, .82);
      border: 1px solid var(--line);
      border-radius: 3px;
      font-size: .72rem;
      color: rgba(245,240,230,.75);
      pointer-events: none;
    }
    .miss-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: .45rem .65rem;
      background: rgba(22, 36, 28, .9);
      border: 1px solid rgba(232, 193, 112, .45);
      border-radius: 3px;
      font-size: .72rem;
      text-align: right;
      pointer-events: none;
    }
    .miss-badge strong { color: var(--gold); display: block; font-size: .85rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      align-items: center;
      margin-top: .65rem;
    }
    button.ctrl {
      background: rgba(93,202,165,.12);
      border: 1px solid var(--mint);
      color: var(--text);
      padding: .35rem .65rem;
      cursor: pointer;
      border-radius: 2px;
      font-size: .78rem;
    }
    input[type=range] { flex: 1; min-width: 120px; accent-color: var(--mint); }
    .time-label {
      font-size: .75rem;
      color: var(--muted);
      min-width: 8rem;
      text-align: right;
    }
    .hud { font-size: .82rem; line-height: 1.5; }
    .hud strong { color: var(--mint); }
    pre {
      background: rgba(0,0,0,.25);
      padding: .55rem;
      border-radius: 2px;
      font-size: .72rem;
      overflow: auto;
      max-height: 140px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .reasoning { color: var(--gold); font-style: italic; font-size: .82rem; line-height: 1.45; }
    .score-big {
      font-family: Cormorant, serif;
      font-size: 2.4rem;
      color: var(--mint);
      margin: .25rem 0;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Orbital Planner</h1>
      <p class="sub">Mesocosm replay — 3D orbital viewport (matches main app)</p>
    </div>
    <div class="hud" id="runHud">Loading replay…</div>
  </header>
  <main>
    <aside class="panel">
      <p class="label">Episodes</p>
      <div id="episodeRail"></div>
    </aside>
    <section class="panel viewport-panel">
      <p class="view-label">3D — auto-tracked</p>
      <div class="viewport-shell">
        <div id="viewportMount" aria-label="3D orbital viewport"></div>
        <div class="legend">
          <span>◆ Chaser</span>
          <span>◇ Target</span>
          <span>⊕ Earth spin</span>
        </div>
        <div class="miss-badge" id="missBadge" hidden>
          <strong id="missVal">—</strong>
          <span id="caVal">—</span>
        </div>
      </div>
      <div class="controls">
        <button class="ctrl" id="btnPlay">Play</button>
        <button class="ctrl" id="btnPrev">◀</button>
        <button class="ctrl" id="btnNext">▶</button>
        <input type="range" id="scrub" min="0" max="7200" step="10" value="0" />
        <select id="speed" class="ctrl">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
        <span class="time-label" id="timeLabel">T+0 s / 7200 s</span>
      </div>
    </section>
    <aside class="panel">
      <p class="label">Turn HUD</p>
      <div class="score-big" id="scoreVal">—</div>
      <div class="hud" id="metrics"></div>
      <p class="label" style="margin-top:.75rem">Reasoning</p>
      <p class="reasoning" id="reasoning">—</p>
      <p class="label" style="margin-top:.75rem">Action</p>
      <pre id="action"></pre>
    </aside>
  </main>
  <script src="data/replay.js"></script>
  <script type="module">
    import { ReplayViewport3D, parseInfo, turnToMission } from "./js/replay-viewport.js";

    let DATA = window.REPLAY;
    let epId = null;
    let turnIdx = 0;
    let scrubT = 0;
    let playing = false;
    const viewport = new ReplayViewport3D(document.getElementById("viewportMount"));

    async function loadReplay() {
      if (DATA) return DATA;
      try {
        const res = await fetch("data/replay.json");
        DATA = await res.json();
      } catch {
        DATA = { run: {}, episodes: [], replay: {} };
      }
      return DATA;
    }

    function turns() {
      return (DATA.replay && DATA.replay[epId]) || [];
    }

    function currentTurn() {
      return turns()[turnIdx] || null;
    }

    function episodeName(id) {
      const turn = DATA.replay[id]?.[0];
      const ep = (DATA.episodes || []).find((e) => e.id === id);
      return (
        turn?.board_before?.name ||
        turn?.observation?.name ||
        ep?.terminal_info?.scenario_name ||
        "Episode"
      );
    }

    function episodeScoreLabel(id) {
      const ep = (DATA.episodes || []).find((e) => e.id === id);
      const ti = ep?.terminal_info;
      if (ti?.score != null) return ti.score;
      if (ep?.total_reward != null) return (ep.total_reward * 100).toFixed(1);
      return null;
    }

    function updateHudPanels() {
      const t = currentTurn();
      if (!t) return;
      const info = parseInfo(t.info);
      const { scenario, score } = turnToMission(t);
      const maxT = viewport.maxT;

      document.getElementById("timeLabel").textContent =
        `T+${scrubT.toFixed(0)} s / ${maxT.toFixed(0)} s`;
      document.getElementById("scrub").max = String(maxT);
      document.getElementById("scrub").value = String(scrubT);

      document.getElementById("scoreVal").textContent = info.score ?? "—";
      document.getElementById("metrics").innerHTML = `
        <div><strong>Scenario</strong> ${scenario.name}</div>
        <div><strong>Tier</strong> ${scenario.tier || "—"}</div>
        <div><strong>Reward</strong> ${Number(t.reward).toFixed(3)}</div>
        <div><strong>Miss</strong> ${info.miss_km ?? "—"} km</div>
        <div><strong>Fuel</strong> ${info.fuel_used ?? "—"} km/s</div>
      `;
      let reasoningText = info.agent_reasoning || t.reasoning || "—";
      if (typeof reasoningText === "string" && reasoningText.trim().startsWith("{")) {
        try {
          const j = JSON.parse(reasoningText);
          if (j.reasoning) reasoningText = j.reasoning;
        } catch { /* keep raw */ }
      }
      document.getElementById("reasoning").textContent = reasoningText;
      document.getElementById("action").textContent =
        typeof t.action === "string" ? t.action : JSON.stringify(t.action, null, 2);

      const badge = document.getElementById("missBadge");
      if (score && Number.isFinite(score.miss_km) && !score.crashed) {
        badge.hidden = false;
        document.getElementById("missVal").textContent = `Miss ${score.miss_km.toFixed(1)} km`;
        document.getElementById("caVal").textContent =
          `closest T+${score.closest_approach_time_s.toFixed(0)} s`;
      } else if (score?.crashed) {
        badge.hidden = false;
        document.getElementById("missVal").textContent = "Crashed";
        document.getElementById("caVal").textContent = "no intercept";
      } else {
        badge.hidden = true;
      }
    }

    function applyTurn() {
      const t = currentTurn();
      if (!t) return;
      viewport.setMission(t);
      scrubT = 0;
      viewport.setScrub(0);
      updateHudPanels();
    }

    function setEpisode(id) {
      epId = id;
      turnIdx = 0;
      playing = false;
      viewport.setPlaying(false);
      document.getElementById("btnPlay").textContent = "Play";
      document.querySelectorAll(".ep-btn").forEach((b) =>
        b.classList.toggle("active", b.dataset.id === id),
      );
      applyTurn();
    }

    function stopPlay() {
      playing = false;
      viewport.setPlaying(false);
      document.getElementById("btnPlay").textContent = "Play";
    }

    async function init() {
      await loadReplay();
      const eps = DATA.episodes || [];
      const rail = document.getElementById("episodeRail");
      rail.innerHTML = "";
      const ids = eps.length ? eps.map((e) => e.id) : Object.keys(DATA.replay || {});
      ids.forEach((id, i) => {
        const btn = document.createElement("button");
        btn.className = "ep-btn" + (i === 0 ? " active" : "");
        btn.dataset.id = id;
        const name = episodeName(id);
        const sc = episodeScoreLabel(id);
        btn.innerHTML = sc != null
          ? `${name}<br><span class="ep-score">score ${sc}</span>`
          : name;
        btn.onclick = () => setEpisode(id);
        rail.appendChild(btn);
      });
      if (ids.length) setEpisode(ids[0]);
      const ms = DATA.run?.scores?.mission_score;
      document.getElementById("runHud").textContent =
        ms != null ? `Run mission_score: ${ms.toFixed(1)}` : "Replay loaded";
    }

    viewport.onScrub = (t) => {
      scrubT = t;
      updateHudPanels();
    };
    viewport.onPlayingChange = (p) => {
      playing = p;
      document.getElementById("btnPlay").textContent = p ? "Pause" : "Play";
    };

    document.getElementById("btnPlay").onclick = () => {
      if (playing) {
        stopPlay();
      } else {
        viewport.speedFactor = Number(document.getElementById("speed").value);
        if (scrubT >= viewport.maxT - 1) {
          scrubT = 0;
          viewport.setScrub(0);
        }
        playing = true;
        viewport.setPlaying(true);
        document.getElementById("btnPlay").textContent = "Pause";
      }
    };

    document.getElementById("btnPrev").onclick = () => {
      stopPlay();
      scrubT = Math.max(0, scrubT - 120);
      viewport.setScrub(scrubT);
      updateHudPanels();
    };

    document.getElementById("btnNext").onclick = () => {
      stopPlay();
      scrubT = Math.min(viewport.maxT, scrubT + 120);
      viewport.setScrub(scrubT);
      updateHudPanels();
    };

    document.getElementById("scrub").oninput = (e) => {
      stopPlay();
      scrubT = Number(e.target.value);
      viewport.setScrub(scrubT);
      updateHudPanels();
    };

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        document.getElementById("btnPlay").click();
      }
      if (e.code === "ArrowLeft") document.getElementById("btnPrev").click();
      if (e.code === "ArrowRight") document.getElementById("btnNext").click();
    });

    init();
  </script>
</body>
</html>
