<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbital Planner — Mesocosm Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1a14;
      --panel: #16241c;
      --mint: #5dcaa5;
      --gold: #e8c170;
      --text: #f5f0e6;
      --muted: rgba(245,240,230,.55);
      --line: rgba(143,184,155,.2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Source Sans 3", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: .75rem;
    }
    h1 { font-family: Cormorant, serif; font-size: 2rem; margin: 0; }
    .sub { color: var(--muted); font-size: .85rem; margin: .2rem 0 0; }
    main {
      display: grid;
      grid-template-columns: 260px 1fr 300px;
      gap: 1rem;
      padding: 1rem 1.5rem 1.5rem;
      min-height: calc(100vh - 5rem);
    }
    @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: .85rem;
    }
    .label {
      font-size: .62rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--mint);
      margin: 0 0 .5rem;
    }
    .tier-label {
      font-size: .58rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: .65rem 0 .25rem;
    }
    .ep-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      padding: .45rem .55rem;
      margin-bottom: .3rem;
      cursor: pointer;
      border-radius: 2px;
      font-size: .76rem;
      line-height: 1.35;
    }
    .ep-btn.active { border-color: var(--mint); background: rgba(93,202,165,.08); }
    .ep-btn.missing { opacity: 0.45; cursor: not-allowed; }
    .ep-btn .ep-score { color: var(--muted); font-size: .7rem; }
    .viewport-panel { display: flex; flex-direction: column; min-height: 520px; }
    .dual-viewport {
      display: flex;
      flex: 1;
      gap: .65rem;
      min-height: 440px;
      min-width: 0;
    }
    .main3d, .birdeye-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .main3d { flex: 1.55; }
    .birdeye-panel { flex: 1; max-width: 360px; min-width: 220px; }
    .view-label {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin: 0 0 .35rem;
    }
    .viewport-shell {
      position: relative;
      flex: 1;
      min-height: 380px;
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
      background: #16241c;
    }
    #viewportMount { position: absolute; inset: 0; }
    #birdEyeCanvas {
      width: 100%;
      height: 100%;
      min-height: 380px;
      display: block;
    }
    .legend {
      position: absolute;
      left: 10px;
      bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: .5rem .85rem;
      padding: .45rem .65rem;
      background: rgba(22, 36, 28, .82);
      border: 1px solid var(--line);
      border-radius: 3px;
      font-size: .72rem;
      color: rgba(245,240,230,.75);
      pointer-events: none;
      z-index: 2;
    }
    .miss-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: .45rem .65rem;
      background: rgba(22, 36, 28, .9);
      border: 1px solid rgba(232, 193, 112, .45);
      border-radius: 3px;
      font-size: .72rem;
      text-align: right;
      pointer-events: none;
      z-index: 2;
    }
    .miss-badge strong { color: var(--gold); display: block; font-size: .85rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      align-items: center;
      margin-top: .65rem;
    }
    button.ctrl {
      background: rgba(93,202,165,.12);
      border: 1px solid var(--mint);
      color: var(--text);
      padding: .35rem .65rem;
      cursor: pointer;
      border-radius: 2px;
      font-size: .78rem;
    }
    input[type=range] { flex: 1; min-width: 120px; accent-color: var(--mint); }
    .time-label { font-size: .75rem; color: var(--muted); min-width: 10rem; text-align: right; }
    .hud { font-size: .82rem; line-height: 1.5; }
    .hud strong { color: var(--mint); }
    pre {
      background: rgba(0,0,0,.25);
      padding: .55rem;
      border-radius: 2px;
      font-size: .72rem;
      overflow: auto;
      max-height: 140px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .reasoning { color: var(--gold); font-style: italic; font-size: .82rem; line-height: 1.45; }
    .score-big {
      font-family: Cormorant, serif;
      font-size: 2.4rem;
      color: var(--mint);
      margin: .25rem 0;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Orbital Planner</h1>
      <p class="sub">14 scenarios · GPT-4o replay · 3D + bird&apos;s eye (10s animation cap at 1×)</p>
    </div>
    <div class="hud" id="runHud">Loading replay…</div>
  </header>
  <main>
    <aside class="panel">
      <p class="label">Scenarios (14)</p>
      <div id="episodeRail"></div>
    </aside>
    <section class="panel viewport-panel">
      <div class="dual-viewport">
        <div class="main3d">
          <p class="view-label">3D — auto-tracked</p>
          <div class="viewport-shell">
            <div id="viewportMount" aria-label="3D orbital viewport"></div>
            <div class="legend">
              <span>◆ Chaser</span>
              <span>◇ Target</span>
              <span>⊕ Earth spin</span>
            </div>
            <div class="miss-badge" id="missBadge" hidden>
              <strong id="missVal">—</strong>
              <span id="caVal">—</span>
            </div>
          </div>
        </div>
        <div class="birdeye-panel">
          <p class="view-label">Bird&apos;s eye (equatorial)</p>
          <div class="viewport-shell">
            <canvas id="birdEyeCanvas" aria-label="Bird's eye orbital view"></canvas>
          </div>
        </div>
      </div>
      <div class="controls">
        <button class="ctrl" id="btnPlay">Play</button>
        <button class="ctrl" id="btnPrev">◀</button>
        <button class="ctrl" id="btnNext">▶</button>
        <input type="range" id="scrub" min="0" max="7200" step="10" value="0" />
        <select id="speed" class="ctrl" title="1× = full mission in 10s wall time">
          <option value="0.5">0.5× (20s)</option>
          <option value="1" selected>1× (10s cap)</option>
          <option value="2">2× (5s)</option>
          <option value="4">4× (2.5s)</option>
        </select>
        <span class="time-label" id="timeLabel">T+0 s / 7200 s</span>
      </div>
    </section>
    <aside class="panel">
      <p class="label">Turn HUD</p>
      <div class="score-big" id="scoreVal">—</div>
      <div class="hud" id="metrics"></div>
      <p class="label" style="margin-top:.75rem">Reasoning</p>
      <p class="reasoning" id="reasoning">—</p>
      <p class="label" style="margin-top:.75rem">Action</p>
      <pre id="action"></pre>
    </aside>
  </main>
  <script src="data/replay.js"></script>
  <script type="module">
    import { ReplayViewport3D, MAX_ANIM_WALL_S, parseInfo, turnToMission } from "./js/replay-viewport.js";
    import { BirdEyeViewport } from "./js/birdeye-viewport.js";

    let DATA = null;
    let SCENARIOS = null;
    let epId = null;
    let turnIdx = 0;
    let scrubT = 0;
    let playing = false;

    const viewport = new ReplayViewport3D(document.getElementById("viewportMount"));
    const birdeye = new BirdEyeViewport(document.getElementById("birdEyeCanvas"));
    birdeye.startLoop(() => scrubT);

    async function loadReplay() {
      try {
        const res = await fetch(`data/replay.json?ts=${Date.now()}`);
        DATA = await res.json();
      } catch {
        DATA = window.REPLAY || { run: {}, episodes: [], replay: {} };
      }
      return DATA;
    }

    async function loadScenarios() {
      try {
        const res = await fetch(`data/scenarios.json?ts=${Date.now()}`);
        if (!res.ok) throw new Error(`scenarios.json ${res.status}`);
        SCENARIOS = await res.json();
      } catch (err) {
        console.error("scenarios load failed", err);
        SCENARIOS = { tiers: {}, all: [] };
      }
      return SCENARIOS;
    }

    function turns() {
      return (DATA.replay && epId && DATA.replay[epId]) || [];
    }

    function currentTurn() {
      return turns()[turnIdx] || null;
    }

    function scenarioIdFromEpisode(ep) {
      if (ep?.terminal_info?.scenario_id) return ep.terminal_info.scenario_id;
      const turn = DATA.replay[ep.id]?.[0];
      return (
        turn?.board_before?.scenario_id ||
        turn?.observation?.scenario_id ||
        parseInfo(turn?.info)?.scenario_id
      );
    }

    function scenarioOrderIds() {
      return (SCENARIOS?.all || []).map((s) => s.id);
    }

    function findEpisodeForScenario(scenarioId) {
      const order = scenarioOrderIds();
      const wantIdx = order.indexOf(scenarioId);

      for (const ep of DATA.episodes || []) {
        if (scenarioIdFromEpisode(ep) === scenarioId) return ep.id;
        if (ep?.terminal_info?.scenario_id === scenarioId) return ep.id;
      }
      for (const [eid, tlist] of Object.entries(DATA.replay || {})) {
        const t = tlist[0];
        const sid =
          t?.board_before?.scenario_id ||
          t?.observation?.scenario_id ||
          parseInfo(t?.info)?.scenario_id;
        if (sid === scenarioId) return eid;
      }
      if (wantIdx >= 0) {
        for (const ep of DATA.episodes || []) {
          const seed = ep?.seed;
          if (seed != null && Number(seed) % order.length === wantIdx) return ep.id;
        }
      }
      return null;
    }

    function episodeScoreForScenario(scenarioId) {
      const eid = findEpisodeForScenario(scenarioId);
      if (!eid) return null;
      const ep = DATA.episodes.find((e) => e.id === eid);
      const ti = ep?.terminal_info;
      if (ti?.score != null) return ti.score;
      if (ep?.total_reward != null) return (ep.total_reward * 100).toFixed(1);
      return null;
    }

    function updateHudPanels() {
      const t = currentTurn();
      if (!t) return;
      const info = parseInfo(t.info);
      const { scenario, score } = turnToMission(t);
      const maxT = viewport.maxT;

      document.getElementById("timeLabel").textContent =
        `T+${scrubT.toFixed(0)} s / ${maxT.toFixed(0)} s · ≤${MAX_ANIM_WALL_S}s @1×`;
      document.getElementById("scrub").max = String(maxT);
      document.getElementById("scrub").value = String(scrubT);

      document.getElementById("scoreVal").textContent = info.score ?? "—";
      document.getElementById("metrics").innerHTML = `
        <div><strong>Scenario</strong> ${scenario.name}</div>
        <div><strong>Tier</strong> ${scenario.tier || "—"}</div>
        <div><strong>Reward</strong> ${Number(t.reward).toFixed(3)}</div>
        <div><strong>Miss</strong> ${info.miss_km ?? "—"} km</div>
        <div><strong>Fuel</strong> ${info.fuel_used ?? "—"} km/s</div>
      `;
      let reasoningText = info.agent_reasoning || t.reasoning || "—";
      if (typeof reasoningText === "string" && reasoningText.trim().startsWith("{")) {
        try {
          const j = JSON.parse(reasoningText);
          if (j.reasoning) reasoningText = j.reasoning;
        } catch { /* keep */ }
      }
      document.getElementById("reasoning").textContent = reasoningText;
      document.getElementById("action").textContent =
        typeof t.action === "string" ? t.action : JSON.stringify(t.action, null, 2);

      const badge = document.getElementById("missBadge");
      if (score && Number.isFinite(score.miss_km) && !score.crashed) {
        badge.hidden = false;
        document.getElementById("missVal").textContent = `Miss ${score.miss_km.toFixed(1)} km`;
        document.getElementById("caVal").textContent =
          `closest T+${score.closest_approach_time_s.toFixed(0)} s`;
      } else if (score?.crashed) {
        badge.hidden = false;
        document.getElementById("missVal").textContent = "Crashed";
        document.getElementById("caVal").textContent = "no intercept";
      } else {
        badge.hidden = true;
      }
    }

    function applyTurn() {
      const t = currentTurn();
      if (!t) return;
      viewport.setMission(t);
      birdeye.setMission(t);
      scrubT = 0;
      viewport.setScrub(0);
      updateHudPanels();
    }

    function setEpisode(id) {
      if (!id || !DATA.replay[id]) return;
      epId = id;
      turnIdx = 0;
      stopPlay();
      document.querySelectorAll(".ep-btn").forEach((b) =>
        b.classList.toggle("active", b.dataset.episodeId === id),
      );
      applyTurn();
    }

    function stopPlay() {
      playing = false;
      viewport.setPlaying(false);
      document.getElementById("btnPlay").textContent = "Play";
    }

    function showInitError(msg) {
      const rail = document.getElementById("episodeRail");
      rail.innerHTML = `<p class="tier-label" style="color:#e8a070">${msg}</p>`;
      document.getElementById("runHud").textContent = "Failed to load demo data";
    }

    async function init() {
      try {
        await Promise.all([loadReplay(), loadScenarios()]);
      } catch (err) {
        console.error(err);
        showInitError("Could not load replay. Hard-refresh or check console.");
        return;
      }
      const rail = document.getElementById("episodeRail");
      rail.innerHTML = "";

      if (!SCENARIOS?.tiers || !DATA?.episodes?.length) {
        showInitError("Missing scenarios or replay data.");
        return;
      }

      const tierOrder = ["easy", "medium", "hard", "expert"];
      let firstId = null;

      for (const tier of tierOrder) {
        const group = SCENARIOS.tiers[tier] || [];
        if (!group.length) continue;
        const tierEl = document.createElement("p");
        tierEl.className = "tier-label";
        tierEl.textContent = tier;
        rail.appendChild(tierEl);

        for (const sc of group) {
          const eid = findEpisodeForScenario(sc.id);
          const btn = document.createElement("button");
          btn.className = "ep-btn" + (eid ? "" : " missing");
          btn.dataset.scenarioId = sc.id;
          btn.dataset.episodeId = eid || "";
          const score = episodeScoreForScenario(sc.id);
          btn.innerHTML = score != null
            ? `${sc.name}<br><span class="ep-score">score ${score}</span>`
            : `${sc.name}<br><span class="ep-score">no run</span>`;
          if (eid) {
            btn.onclick = () => setEpisode(eid);
            if (!firstId) firstId = eid;
          }
          rail.appendChild(btn);
        }
      }

      if (firstId) setEpisode(firstId);

      const nEp = DATA.episodes?.length ?? 0;
      const model = DATA.run?.config?.agent_config?.model ?? "—";
      const ms = DATA.run?.scores?.mission_score ?? DATA.run?.scores?.mean_reward;
      document.getElementById("runHud").textContent =
        `${nEp} episodes · ${model}` + (ms != null ? ` · score ${Number(ms).toFixed(1)}` : "");
    }

    viewport.onScrub = (t) => {
      scrubT = t;
      updateHudPanels();
    };
    viewport.onPlayingChange = (p) => {
      playing = p;
      document.getElementById("btnPlay").textContent = p ? "Pause" : "Play";
    };

    document.getElementById("btnPlay").onclick = () => {
      if (playing) stopPlay();
      else {
        viewport.speedFactor = Number(document.getElementById("speed").value);
        if (scrubT >= viewport.maxT - 1) {
          scrubT = 0;
          viewport.setScrub(0);
        }
        playing = true;
        viewport.setPlaying(true);
        document.getElementById("btnPlay").textContent = "Pause";
      }
    };

    document.getElementById("btnPrev").onclick = () => {
      stopPlay();
      scrubT = Math.max(0, scrubT - Math.max(60, viewport.maxT / 80));
      viewport.setScrub(scrubT);
      updateHudPanels();
    };

    document.getElementById("btnNext").onclick = () => {
      stopPlay();
      scrubT = Math.min(viewport.maxT, scrubT + Math.max(60, viewport.maxT / 80));
      viewport.setScrub(scrubT);
      updateHudPanels();
    };

    document.getElementById("scrub").oninput = (e) => {
      stopPlay();
      scrubT = Number(e.target.value);
      viewport.setScrub(scrubT);
      updateHudPanels();
    };

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        document.getElementById("btnPlay").click();
      }
      if (e.code === "ArrowLeft") document.getElementById("btnPrev").click();
      if (e.code === "ArrowRight") document.getElementById("btnNext").click();
    });

    init().catch((err) => {
      console.error(err);
      showInitError(err?.message || "Init failed");
    });
  </script>
</body>
</html>
